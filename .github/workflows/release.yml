name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: sushTun-windows.exe
            source: dist/sushTun.exe
          - os: ubuntu-latest
            artifact: sushTun-linux
            source: dist/sushTun
          - os: macos-latest
            artifact: sushTun-macos
            source: dist/sushTun
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        run: python scripts/fetch_deps.py
      - name: Build
        run: pyinstaller tools/build.spec
      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # The installable Windows package, separate from the portable one-file
  # build. Packages the one-dir tree: the one-file exe re-extracts ~170 MB to
  # %TEMP% on every launch, which is not a price an installed app should pay.
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        run: python scripts/fetch_deps.py
      - name: Build one-dir
        run: pyinstaller tools/build.spec
        env:
          SUSHTUN_ONEDIR: "1"
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(python -c 'import xrayui; print(xrayui.__version__)')" >> "$GITHUB_OUTPUT"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: iscc /DAppVersion=${{ steps.version.outputs.value }} tools\installer.iss
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushTun-setup
          path: dist/sushTun-Setup-*.exe

  # The installable macOS package, separate from the portable one-file build.
  # A bare Unix executable is not something macOS can open: the download loses
  # its +x bit, so Finder shows it as a document and a double-click does
  # nothing. This produces the .app inside a .dmg users expect.
  macos-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        run: python scripts/fetch_deps.py
      # Built here rather than committed: .icns is a binary blob that would
      # have to be regenerated by hand every time the icon changes.
      - name: Build the app icon
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/icon.png \
              --out "icon.iconset/icon_${size}x${size}.png"
            sips -z $((size * 2)) $((size * 2)) assets/icon.png \
              --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o assets/icon.icns
      - name: Build one-dir
        run: pyinstaller tools/build.spec
        env:
          SUSHTUN_ONEDIR: "1"
      - name: Package the .dmg
        run: |
          set -euo pipefail
          # Same marker both other installers drop: it tells paths.py this copy
          # is installed, so settings and profiles go to Application Support
          # instead of inside the bundle (which is read-only once signed).
          touch "dist/sushTun.app/Contents/MacOS/.installed"
          # Ad-hoc signature. There is no Apple Developer ID, so Gatekeeper
          # still makes the user allow it once under Privacy & Security, but
          # an unsigned arm64 bundle would not launch at all.
          codesign --force --deep --sign - "dist/sushTun.app"
          # Reported, never fatal: publish waits on this job, so a verifier
          # that trips over the bundle layout would hold back the Windows and
          # Linux assets too -- for a signature the user has to override by
          # hand anyway.
          codesign --verify --deep --strict "dist/sushTun.app" \
            || echo "::warning::codesign --verify reported problems"
          mkdir -p dmg
          cp -R "dist/sushTun.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname sushTun -srcfolder dmg -ov -format UDZO \
            sushTun-macos.dmg
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushTun-macos-dmg
          path: sushTun-macos.dmg

  # The installable package, separate from the portable one-file build.
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        run: python scripts/fetch_deps.py
      - name: Build one-dir
        run: pyinstaller tools/build.spec
        env:
          SUSHTUN_ONEDIR: "1"
      - name: Package .deb
        run: python scripts/build_deb.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sushtun-deb
          path: dist/*.deb

  # Publishing runs once, after every build: jobs racing to create the same
  # release drops assets from whichever loses.
  publish:
    needs: [build, windows-installer, macos-app, deb]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      # The in-app updater refuses to install anything it cannot match against
      # this file (xrayui/core/updates.py), so it ships with every release.
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      # Written for people in CHANGELOG.md, English then Persian; a tag with no
      # section fails here rather than shipping a bare GitHub compare link.
      - uses: actions/checkout@v4
        with:
          path: source
      - name: Write release notes
        run: python3 source/scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release_notes.md
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
