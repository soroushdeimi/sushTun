name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: XrayPortable-windows.exe
            source: dist/XrayPortable.exe
          - os: ubuntu-latest
            artifact: XrayPortable-linux
            source: dist/XrayPortable
          - os: macos-latest
            artifact: XrayPortable-macos
            source: dist/XrayPortable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        run: python scripts/fetch_deps.py
      - name: Build
        run: pyinstaller tools/build.spec
      - name: Rename artifact
        shell: bash
        run: cp "${{ matrix.source }}" "${{ matrix.artifact }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # Publishing runs once, after every build: three jobs racing to create the
  # same release drops assets from whichever loses.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
