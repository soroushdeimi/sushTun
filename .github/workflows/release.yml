name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Fetch redistributables
        shell: pwsh
        run: pwsh -File scripts/fetch-deps.ps1
      - name: Build exe
        run: pyinstaller tools/build.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XrayPortable
          path: dist/XrayPortable.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/XrayPortable.exe
          generate_release_notes: true
