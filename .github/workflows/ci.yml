name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Qt needs these even for the offscreen platform plugin; without them
      # PySide6 fails to import and the UI tests silently skip.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3
      # Full dev deps, not just ruff+pytest: PySide6 is what lets the UI tests
      # run instead of skipping, and it matches what the release build installs.
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip -r requirements-dev.txt
      # Fetches the bundled binaries so the asset-gated tests run, not skip.
      - run: python scripts/fetch_deps.py
      # -rs lists why each test was skipped, which is what matters on macOS.
      - name: Test
        run: python -m pytest -q -rs
        env:
          QT_QPA_PLATFORM: offscreen
      # Evidence for the clipboard fix: reports only, never fails the job.
      # The elevated app is started by osascript, outside the user's login
      # session. A LaunchDaemon in the system domain is the nearest thing a
      # runner can produce, so the app's own clipboard code runs there and
      # must read and write what the user's session sees.
      - name: App clipboard from outside the user's session
        shell: bash
        run: |
          set -euo pipefail
          PY="$(command -v python)"
          ME="$(id -u)"
          TOKEN="from-user-$(python3 -c 'import secrets; print(secrets.token_hex(6))')"
          printf '%s' "$TOKEN" | pbcopy
          cat > /tmp/sushtun_clip.sh <<EOF
          #!/bin/bash
          cd "$PWD"
          export SUDO_UID=$ME PYTHONPATH="$PWD"
          exec "$PY" -c 'from xrayui.core import desktop
          print("READ:" + repr(desktop.session_clipboard_text()))
          print("WROTE:" + repr(desktop.set_session_clipboard_text("from-root-ok")))' >/tmp/sushtun_clip.out 2>&1
          EOF
          chmod 755 /tmp/sushtun_clip.sh
          sudo tee /Library/LaunchDaemons/com.sushtun.clip.plist >/dev/null <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>Label</key><string>com.sushtun.clip</string>
            <key>ProgramArguments</key><array><string>/tmp/sushtun_clip.sh</string></array>
            <key>RunAtLoad</key><true/>
          </dict></plist>
          EOF
          sudo launchctl bootstrap system /Library/LaunchDaemons/com.sushtun.clip.plist
          for i in $(seq 1 40); do grep -q WROTE /tmp/sushtun_clip.out 2>/dev/null && break; sleep 0.5; done
          cat /tmp/sushtun_clip.out
          grep -q "READ:'$TOKEN'" /tmp/sushtun_clip.out
          grep -q "WROTE:True" /tmp/sushtun_clip.out
          test "$(pbpaste)" = "from-root-ok"
          echo "CLIPBOARD BRIDGE OK"
      - name: Pasteboard seen from root
        continue-on-error: true
        shell: bash
        run: |
          set -u
          echo "RUNNER_USER: $(id -un) (uid $(id -u))"
          echo "PBCOPY: $(command -v pbcopy || echo missing)"
          echo "PBPASTE: $(command -v pbpaste || echo missing)"
          TOKEN="sushtun-$(python3 -c 'import secrets; print(secrets.token_hex(8))')"
          printf '%s' "$TOKEN" | pbcopy
          echo "TOKEN: $TOKEN"
          USER_SEES="$(pbpaste)"
          echo "AS_USER pbpaste: [$USER_SEES]"
          ROOT_SEES="$(sudo pbpaste 2>&1)"
          echo "AS_ROOT sudo pbpaste: [$ROOT_SEES]"
          VIA_SEES="$(sudo sudo -u "$USER" pbpaste 2>&1)"
          echo "AS_ROOT sudo sudo -u $USER pbpaste: [$VIA_SEES]"
          PY="$(command -v python)"
          echo "PY: $PY"
          APP_SEES="$(sudo env PYTHONPATH="$PWD" "$PY" -c '
          import subprocess
          from xrayui.core import desktop
          su = desktop.session_user()
          print("session_user:", su, file=__import__("sys").stderr)
          argv = desktop._as_user(*su, ["pbpaste"]) if su else None
          print("argv:", argv, file=__import__("sys").stderr)
          if argv:
              print(subprocess.run(argv, capture_output=True, text=True, timeout=10).stdout, end="")
          ' 2>&1)"
          echo "APP_PATH (as root, via session_user/_as_user): [$APP_SEES]"
          yn() { case "$1" in *"$TOKEN"*) echo y;; *) echo n;; esac; }
          echo "PASTEBOARD: root_sees_token=$(yn "$ROOT_SEES") user_via_sudo_sees_token=$(yn "$VIA_SEES")"
