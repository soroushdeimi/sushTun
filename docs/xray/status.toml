status = "partial"
files = ["xrayui/core/dns.py"]
link = "n/a"
note = "set by sushTun for its domestic/bootstrap servers only"

[[key]]
match = ["dns.*"]
status = "imported"
files = ["xrayui/core/dns.py"]
link = "n/a"
note = "only through the raw DNS override (settings.dns.raw_override): expectIPs/unexpectedIPs/finalQuery, per-server queryStrategy, clientIp, timeouts, caching, useSystemHosts"

# == log, policy, observatory ===================================================================

[[key]]
match = ["log", "log.loglevel"]
status = "full"
files = ["xrayui/core/render.py", "xrayui/core/settings.py"]
link = "n/a"

[[key]]
match = ["log.*"]
status = "unsupported"
link = "n/a"
note = "dnsLog, maskAddress"

[[key]]
match = ["policy", "policy.*"]
status = "unsupported"
link = "n/a"
note = "per-level timeouts and buffer size"

[[key]]
match = ["observatory", "observatory.*", "burstObservatory", "burstObservatory.*"]
status = "unsupported"
link = "n/a"
note = "needed for policy groups"
