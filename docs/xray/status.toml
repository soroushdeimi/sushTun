# sushTun's support for every client-side Xray key (class "client" in
# classification.toml), read by scripts/xray_keys.py and
# tests/test_xray_coverage.py.
#
# status:
#   full         a form or setting writes it, and a share link carries it when
#                links have a field for it
#   partial      written, but with a fixed value or only some of its forms
#   imported     reaches the config only inside raw JSON the user pastes or
#                imports (the xhttp `extra` field, the DNS raw override)
#   alias        another spelling of a key sushTun covers (the core accepts
#                both); nothing to add
#   unsupported  never written
# link: yes = parsed from and written back to share links; import = parsed
#   only; no = links have no field for it; n/a = not a per-server setting.
# sub: subscriptions are parsed exactly like pasted links
#   (importer.parse_subscription -> parse_share_text), so sub = link unless
#   noted. JSON-format subscriptions are not supported.
#
# The first entry whose pattern matches wins. `*` matches anything. Entries
# with status full or partial must name exact keys (no `*`): a new key under a
# supported object must be looked at, not inherited as supported. `imported`
# and `alias` may use `*` when the whole subtree really behaves that way (the
# DNS raw override reaches any dns key). tests/test_xray_coverage.py enforces it.

# == outbounds: the proxy outbound, per protocol ==================================

[[key]]
match = ["outbounds", "outbounds[].protocol"]
status = "full"
files = ["xrayui/core/profiles.py", "xrayui/core/outbounds/__init__.py"]
link = "yes"
sub = "= link"

